<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c82"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96a1b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07a12"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect width="1100" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">Cause 2 (~5 GiB) - all weight conversions ran in one batch</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">propagate_constants evaluates constant sub-graphs (e.g. TernOCL's weight re-packing) in one network, then drops the inputs.</text>
<text x="40" y="100" font-size="13" font-weight="600" fill="#b8433a" text-anchor="start">Before: one network over everything</text>
<line x1="70" y1="320" x2="510" y2="320" stroke="#6b7480" stroke-width="1"/>
<line x1="70" y1="120" x2="70" y2="320" stroke="#6b7480" stroke-width="1"/>
<text x="64" y="128" font-size="11" font-weight="400" fill="#6b7480" text-anchor="end">GiB</text>
<text x="510" y="338" font-size="11" font-weight="400" fill="#6b7480" text-anchor="end">time -&gt;</text>
<path d="M 70 234.28571428571428 L 370 234.28571428571428 L 370 320 " stroke="#2f6fb3" stroke-width="2" fill="none"/>
<path d="M 70 234.28571428571428 L 370 148.57142857142856 L 510 234.28571428571428" stroke="#b8433a" stroke-width="2.5" fill="none"/>
<text x="370" y="140.57142857142856" font-size="12" font-weight="600" fill="#b8433a" text-anchor="middle">peak ~ inputs 6 + outputs 6</text>
<text x="80" y="277.1428571428571" font-size="11" font-weight="400" fill="#2f6fb3" text-anchor="start">u2 inputs</text>
<text x="580" y="100" font-size="13" font-weight="600" fill="#3a8a3a" text-anchor="start">After: chunks of ~512 MiB, inputs freed per chunk</text>
<line x1="610" y1="320" x2="1050" y2="320" stroke="#6b7480" stroke-width="1"/>
<line x1="610" y1="120" x2="610" y2="320" stroke="#6b7480" stroke-width="1"/>
<text x="604" y="128" font-size="11" font-weight="400" fill="#6b7480" text-anchor="end">GiB</text>
<text x="1050" y="338" font-size="11" font-weight="400" fill="#6b7480" text-anchor="end">time -&gt;</text>
<path d="M 610.0 234.28571428571428 L 647.5 224.28571428571428 L 685.0 224.28571428571428 L 722.5 224.28571428571428 L 760.0 224.28571428571428 L 797.5 224.28571428571428 L 835.0 224.28571428571428 L 872.5 224.28571428571428 L 910.0 234.28571428571428 L 1050 234.28571428571428" stroke="#3a8a3a" stroke-width="2.5" fill="none"/>
<text x="760" y="214.28571428571428" font-size="12" font-weight="600" fill="#3a8a3a" text-anchor="middle">~ 6 + one chunk</text>
<text x="620" y="277.1428571428571" font-size="11" font-weight="400" fill="#2f6fb3" text-anchor="start">u2 inputs</text>
<rect x="40" y="350" width="1020" height="100" rx="6" fill="#e2f0e2" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="550.0" y="371.2" font-size="13" font-weight="600" fill="#3a8a3a" text-anchor="middle">The fix</text>
<text x="550.0" y="387.76" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">split the constant graph into independent pieces (union-find), run one small network per ~512 MiB of inputs,</text>
<text x="550.0" y="404.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">then release the inputs whose users are all constants (the program deletes them afterwards anyway)</text>
<text x="550.0" y="420.88" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">GPU-buffer peak 14.0 -&gt; 8.8 GiB = its final level: no transient left. Knob for A/B: OV_GPU_CONST_PROP_CHUNK_MB (0 = old)</text>
<text x="550.0" y="437.44" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">general fix: should help every model whose weights get re-ordered/re-packed at compile time, e.g. oneDNN on dGPUs (not measured)</text>
</svg>