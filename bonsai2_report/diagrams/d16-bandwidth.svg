<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c82"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96a1b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07a12"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect width="1000" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">Step 3a - 'we are bandwidth-bound' was wrong</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">Decode reads all 6.86 GB of weights once per token, so tokens/s x bytes = achieved bandwidth.</text>
<line x1="280.0" y1="94" x2="280.0" y2="320" stroke="#d9dde2" stroke-width="1" stroke-dasharray="4 4"/>
<text x="280.0" y="90" font-size="10" font-weight="400" fill="#6b7480" text-anchor="middle">0</text>
<line x1="387.5" y1="94" x2="387.5" y2="320" stroke="#d9dde2" stroke-width="1" stroke-dasharray="4 4"/>
<text x="387.5" y="90" font-size="10" font-weight="400" fill="#6b7480" text-anchor="middle">40</text>
<line x1="495.0" y1="94" x2="495.0" y2="320" stroke="#d9dde2" stroke-width="1" stroke-dasharray="4 4"/>
<text x="495.0" y="90" font-size="10" font-weight="400" fill="#6b7480" text-anchor="middle">80</text>
<line x1="602.5" y1="94" x2="602.5" y2="320" stroke="#d9dde2" stroke-width="1" stroke-dasharray="4 4"/>
<text x="602.5" y="90" font-size="10" font-weight="400" fill="#6b7480" text-anchor="middle">120</text>
<line x1="710.0" y1="94" x2="710.0" y2="320" stroke="#d9dde2" stroke-width="1" stroke-dasharray="4 4"/>
<text x="710.0" y="90" font-size="10" font-weight="400" fill="#6b7480" text-anchor="middle">160</text>
<text x="270" y="120.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">theoretical peak (LPDDR5X)</text>
<rect x="280" y="100" width="412.8" height="30" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="698.8" y="120.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">153.6 GB/s   8 x 16-bit x 9600 MT/s</text>
<text x="270" y="164.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">TernOCL GEMV kernels alone</text>
<rect x="280" y="144" width="284.875" height="30" rx="3" fill="#2a8c82" stroke="none" opacity="1.0"/>
<text x="570.875" y="164.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">106 GB/s   same in BOTH backends (69% of peak)</text>
<text x="270" y="208.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">native OpenVINO, whole token</text>
<rect x="280" y="188" width="276.8125" height="30" rx="3" fill="#6b4fa0" stroke="none" opacity="1.0"/>
<text x="562.8125" y="208.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">103 GB/s   15.0 t/s</text>
<text x="270" y="252.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">ggml-openvino, whole token</text>
<rect x="280" y="232" width="236.5" height="30" rx="3" fill="#2f6fb3" stroke="none" opacity="1.0"/>
<text x="522.5" y="252.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">88 GB/s   12.25 t/s</text>
<text x="270" y="296.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">old 'hardware wall' claim</text>
<rect x="280" y="276" width="215.0" height="30" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="501.0" y="296.4" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">80 GB/s   retracted</text>
<rect x="30" y="330" width="940" height="47.599999999999994" rx="6" fill="#fbf1d3" stroke="#a07a12" stroke-width="1.5"/>
<text x="40" y="349.84000000000003" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">The ternary kernels are equally fast on both paths. The lower whole-token number for ggml-openvino means its</text>
<text x="40" y="366.40000000000003" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">token takes longer for reasons other than reading weights - i.e. extra work around the GEMVs (next diagram).</text>
</svg>