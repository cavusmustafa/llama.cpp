<text x="50" y="463.96" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">Before: the heap grows for ~60 s (merged-weight copies + bound evaluation), then GPU buffers ramp to 23 GiB as everything is uploaded</text>
<text x="50" y="480.52" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">and repacked at once. After: merged copies released as they are uploaded, constants processed in chunks - done in ~10 s.</text>
<text x="50" y="497.08" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">(1-second samples; the 100 ms-sampled peaks of the same runs are 27.9 and 9.1 GiB.)</text>
