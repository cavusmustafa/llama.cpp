<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24">Fix 1 - mapping PQ2_0 onto OpenVINO's u2</text>
<text x="24" y="56" font-size="13" fill="#6b7480">OpenVINO has no signed 2-bit type, so ternary is carried as UNSIGNED u2 codes {0,1,2} with a zero point of 1.</text>
<text x="24" y="74" font-size="13" fill="#6b7480">That is exactly how ggml already stores PQ2_0 - so the two formats line up with no conversion.</text>

<!-- the lucky coincidence -->
<rect x="24" y="96" width="952" height="150" rx="6" fill="#eaf5ee" stroke="#2d8a4e" stroke-width="1.5"/>
<text x="40" y="118" font-size="14" font-weight="600" fill="#2d8a4e">The key observation: the bit layouts are identical</text>

<text x="40" y="146" font-size="12" font-weight="600" fill="#1b1f24">ggml PQ2_0</text>
<text x="40" y="166" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">code j  -&gt;  byte j/4,  bits [2*(j%4), +1]</text>
<text x="40" y="184" font-size="11.5" fill="#6b7480">lowest bits hold the earliest element</text>

<text x="40" y="212" font-size="12" font-weight="600" fill="#1b1f24">OpenVINO u2</text>
<text x="40" y="232" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">value j  -&gt;  byte j/4,  bits [2*(j%4), +1]</text>

<text x="540" y="146" font-size="12" fill="#1b1f24">OpenVINO packs every sub-byte type LSB-first</text>
<text x="540" y="164" font-size="12" fill="#1b1f24">except u1:</text>
<text x="540" y="186" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#6b7480">constexpr bool is_lsb_packed(Type_t et) {</text>
<text x="540" y="202" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#6b7480">    return et != u1;</text>
<text x="540" y="218" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#6b7480">}</text>
<text x="540" y="238" font-size="12" font-weight="600" fill="#2d8a4e">=&gt; the 32 code bytes are copied verbatim.</text>

<!-- extraction -->
<text x="24" y="282" font-size="14" font-weight="600" fill="#1b1f24">So extraction is trivial</text>

<rect x="24" y="296" width="250" height="118" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="149" y="318" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">GGUF block (34 B)</text>
<rect x="40" y="330" width="52" height="30" rx="3" fill="#dce9f5" stroke="#2f6fb3"/>
<text x="66" y="350" font-size="11" text-anchor="middle" fill="#1b1f24">d f16</text>
<rect x="96" y="330" width="162" height="30" rx="3" fill="#e4f1ef" stroke="#2a8c82"/>
<text x="177" y="350" font-size="11" text-anchor="middle" fill="#1b1f24">qs[32]</text>
<text x="40" y="382" font-size="11" fill="#6b7480">scales and codes are interleaved,</text>
<text x="40" y="398" font-size="11" fill="#6b7480">one pair per 128 weights</text>

<path d="M 282 355 L 326 355" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a93a0"/></marker></defs>

<rect x="334" y="296" width="290" height="118" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="479" y="318" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">split into two plain arrays</text>
<rect x="350" y="330" width="258" height="26" rx="3" fill="#e4f1ef" stroke="#2a8c82"/>
<text x="479" y="348" font-size="11" text-anchor="middle" fill="#1b1f24">weights: u2 [N, K]   (memcpy of every qs)</text>
<rect x="350" y="362" width="258" height="26" rx="3" fill="#dce9f5" stroke="#2f6fb3"/>
<text x="479" y="380" font-size="11" text-anchor="middle" fill="#1b1f24">scales: f16 [N, K/128]</text>
<text x="350" y="404" font-size="11" fill="#2d8a4e">no bit shuffling, no re-encoding</text>

<path d="M 632 355 L 676 355" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="684" y="296" width="292" height="118" rx="5" fill="#fdf7ee" stroke="#c77c1e"/>
<text x="830" y="318" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a8641a">kernel's own repack (in the plugin)</text>
<text x="698" y="340" font-size="11" fill="#1b1f24">done once at compile time, not per inference:</text>
<text x="698" y="358" font-size="11" fill="#1b1f24">[N,K] u2  -&gt;  [K/16, N] uint32, K-major</text>
<text x="698" y="376" font-size="11" fill="#1b1f24">codes re-encoded to two's complement {0,1,3}</text>
<text x="698" y="398" font-size="11" fill="#6b7480">so inference never unpacks or reorders</text>

<!-- the OV subgraph -->
<text x="24" y="456" font-size="14" font-weight="600" fill="#1b1f24">What ggml-openvino emits into the OpenVINO graph</text>
<text x="24" y="476" font-size="12" fill="#6b7480">This is the standard "weight decompression" shape that the GPU plugin recognises and folds into a compressed matmul.</text>

<rect x="24" y="492" width="128" height="42" rx="5" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="88" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Constant</text>
<text x="88" y="527" font-size="11" text-anchor="middle" fill="#1b1f24">u2 [N, K/128, 128]</text>
<path d="M 156 513 L 186 513" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="190" y="492" width="100" height="42" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="240" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Convert</text>
<text x="240" y="527" font-size="11" text-anchor="middle" fill="#1b1f24">to f16</text>
<path d="M 294 513 L 324 513" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="328" y="492" width="132" height="42" rx="5" fill="#fdf0dc" stroke="#c77c1e" stroke-width="1.5"/>
<text x="394" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Subtract</text>
<text x="394" y="527" font-size="11" text-anchor="middle" fill="#1b1f24">scalar f16 Constant 1</text>
<path d="M 464 513 L 494 513" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="498" y="492" width="126" height="42" rx="5" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="561" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Multiply</text>
<text x="561" y="527" font-size="11" text-anchor="middle" fill="#1b1f24">scales [N,K/128,1]</text>
<path d="M 628 513 L 658 513" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="662" y="492" width="100" height="42" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="712" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Reshape</text>
<text x="712" y="527" font-size="11" text-anchor="middle" fill="#1b1f24">back to [N, K]</text>
<path d="M 766 513 L 796 513" stroke="#8a93a0" stroke-width="2" marker-end="url(#ar)"/>

<rect x="800" y="492" width="176" height="42" rx="5" fill="#f0e9f5" stroke="#7d5ba6" stroke-width="1.5"/>
<text x="888" y="511" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4a3366">MatMul</text>
<text x="888" y="527" font-size="11" text-anchor="middle" fill="#4a3366">-&gt; FullyConnectedCompressed</text>

<rect x="24" y="556" width="952" height="122" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="578" font-size="13" font-weight="600" fill="#c0392b">Two details that are easy to get wrong</text>
<text x="40" y="602" font-size="12" fill="#1b1f24"><tspan font-weight="600">1. The zero point must be a Constant, not a Convert of an integer.</tspan>  The ternary kernel reads the zero point</text>
<text x="40" y="619" font-size="12" fill="#1b1f24">directly out of memory at build time. If the graph says Convert(Constant(1)) instead of Constant(1.0f16), the value is</text>
<text x="40" y="636" font-size="12" fill="#1b1f24">not there yet and the fusion silently does not happen. (Same trap hit earlier in the MoE work.)</text>
<text x="40" y="660" font-size="12" fill="#1b1f24"><tspan font-weight="600">2. Never requantize a ternary tensor.</tspan>  See diagram 05, fix 4 - the backend used to force the embedding and output</text>
<text x="40" y="677" font-size="12" fill="#1b1f24">weights to 8-bit, which inflates 2.13 bpw to 8 and drops them off the ternary path entirely.</text>
</svg>
