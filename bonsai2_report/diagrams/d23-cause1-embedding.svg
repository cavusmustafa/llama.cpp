<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c82"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96a1b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07a12"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">Cause 1 (~9.4 GiB) - the u2 token embedding was decompressed to f16 at compile time</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">The lookup table is 248 320 x 5120 ternary weights: 303 MiB as u2, 2.37 GiB as f16.</text>
<text x="40" y="92" font-size="13" font-weight="600" fill="#b8433a" text-anchor="start">Before: the 'compressed gather' pattern accepted u8/i8/u4/i4 only - not u2</text>
<rect x="40" y="104" width="180" height="56" rx="6" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="130.0" y="128.04" font-size="13" font-weight="600" fill="#2a8c82" text-anchor="middle">u2 table</text>
<text x="130.0" y="144.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">303 MiB</text>
<rect x="245" y="104" width="180" height="56" rx="6" fill="#f6dedb" stroke="#b8433a" stroke-width="1.5"/>
<text x="335.0" y="128.04" font-size="13" font-weight="600" fill="#b8433a" text-anchor="middle">Convert f16</text>
<text x="335.0" y="144.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">2.37 GiB</text>
<line x1="220" y1="132" x2="245" y2="132" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="245.0,132.0 236.0,127.5 236.0,136.5" fill="#1b1f24"/>
<rect x="450" y="104" width="180" height="56" rx="6" fill="#f6dedb" stroke="#b8433a" stroke-width="1.5"/>
<text x="540.0" y="128.04" font-size="13" font-weight="600" fill="#b8433a" text-anchor="middle">Subtract zp</text>
<text x="540.0" y="144.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">2.37 GiB</text>
<line x1="425" y1="132" x2="450" y2="132" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="450.0,132.0 441.0,127.5 441.0,136.5" fill="#1b1f24"/>
<rect x="655" y="104" width="180" height="56" rx="6" fill="#f6dedb" stroke="#b8433a" stroke-width="1.5"/>
<text x="745.0" y="128.04" font-size="13" font-weight="600" fill="#b8433a" text-anchor="middle">Multiply scale</text>
<text x="745.0" y="144.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">2.37 GiB</text>
<line x1="630" y1="132" x2="655" y2="132" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="655.0,132.0 646.0,127.5 646.0,136.5" fill="#1b1f24"/>
<rect x="860" y="104" width="180" height="56" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="950.0" y="128.04" font-size="13" font-weight="600" fill="#6b7480" text-anchor="middle">Gather rows</text>
<text x="950.0" y="144.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">per token</text>
<line x1="835" y1="132" x2="860" y2="132" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="860.0,132.0 851.0,127.5 851.0,136.5" fill="#1b1f24"/>
<text x="40" y="186.0" font-size="12" font-weight="400" fill="#b8433a" text-anchor="start">The plugin constant-folds the whole chain on its own: several 2.37 GiB intermediates exist at once (~7 GiB transient),</text>
<text x="40" y="202.2" font-size="12" font-weight="400" fill="#b8433a" text-anchor="start">and the final f16 table stays resident (+2.5 GiB). GenAI never hits this: it keeps embeddings in a separate model.</text>
<text x="40" y="250" font-size="13" font-weight="600" fill="#3a8a3a" text-anchor="start">After: u2 added to the pattern and to the GPU gather kernel</text>
<rect x="40" y="262" width="380" height="64" rx="6" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="230.0" y="290.04" font-size="13" font-weight="600" fill="#2a8c82" text-anchor="middle">u2 table</text>
<text x="230.0" y="306.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">u2 table stays 303 MiB on the GPU</text>
<rect x="480" y="262" width="560" height="64" rx="6" fill="#e2f0e2" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="760.0" y="281.76" font-size="13" font-weight="600" fill="#3a8a3a" text-anchor="middle">one op</text>
<text x="760.0" y="298.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">GatherCompressed: decode only the rows that are looked up,</text>
<text x="760.0" y="314.88" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">(code &gt;&gt; 2*(i%4)) &amp; 3, then (code - zp) x scale</text>
<line x1="420" y1="294" x2="480" y2="294" stroke="#3a8a3a" stroke-width="1.6"/>
<polygon points="480.0,294.0 471.0,289.5 471.0,298.5" fill="#3a8a3a"/>
<rect x="40" y="350" width="1000" height="88" rx="6" fill="#e2f0e2" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="540.0" y="373.48" font-size="13" font-weight="600" fill="#3a8a3a" text-anchor="middle">Verified</text>
<text x="540.0" y="390.04" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">new kernel bit-exact vs a host reference (which is itself bit-exact vs the old unfused path), incl. first and last row</text>
<text x="540.0" y="406.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">exec graph: gather_ref__f16 -&gt; gather_ref__u2;  CPU plugin explicitly keeps its old behaviour (no u2 gather there)</text>
<text x="540.0" y="423.16" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">pure-OpenVINO compile of the ggml graph: 17.6 -&gt; 8.4 GiB (TernOCL off), 27.9 -&gt; 18.5 GiB (TernOCL on)</text>
</svg>