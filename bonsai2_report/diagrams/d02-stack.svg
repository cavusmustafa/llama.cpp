<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c82"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96a1b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07a12"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">The software stack - who does what</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">Three ways to run the same model on the same GPU. This project works on the middle column.</text>
<rect x="40" y="80" width="300" height="56" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="190.0" y="112.68" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">llama-cli / llama-bench</text>
<rect x="400" y="80" width="300" height="56" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="550.0" y="112.68" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">llama-cli / llama-bench</text>
<rect x="760" y="80" width="300" height="56" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="910.0" y="112.68" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">llm_bench.py (Python)</text>
<rect x="40" y="160" width="660" height="74" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="370.0" y="183.74" font-size="14" font-weight="600" fill="#2f6fb3" text-anchor="middle">llama.cpp</text>
<text x="370.0" y="201.68" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">PrismML fork of llama.cpp: reads the GGUF file (knows the PQ2_0 type),</text>
<text x="370.0" y="219.62" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">builds a ggml compute graph for every batch of tokens</text>
<rect x="40" y="258" width="300" height="74" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="190.0" y="282.76" font-size="13" font-weight="600" fill="#6b7480" text-anchor="middle">ggml-vulkan</text>
<text x="190.0" y="299.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">SPIR-V shaders via Mesa</text>
<text x="190.0" y="315.88" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">(baseline for comparison)</text>
<rect x="400" y="258" width="300" height="74" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="550.0" y="282.76" font-size="13" font-weight="600" fill="#2f6fb3" text-anchor="middle">ggml-openvino backend</text>
<text x="550.0" y="299.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">translates the ggml graph</text>
<text x="550.0" y="315.88" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">into an OpenVINO model</text>
<rect x="760" y="160" width="300" height="172" rx="6" fill="#ebe5f4" stroke="#6b4fa0" stroke-width="1.5"/>
<text x="910.0" y="200.64" font-size="13" font-weight="600" fill="#6b4fa0" text-anchor="middle">OpenVINO GenAI</text>
<text x="910.0" y="217.2" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">reads an OpenVINO IR file</text>
<text x="910.0" y="233.76" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">(xml graph + bin weights)</text>
<text x="910.0" y="250.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">tokenizer, sampling, KV cache</text>
<text x="910.0" y="266.88" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle"></text>
<text x="910.0" y="283.44" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">the 'native' reference:</text>
<text x="910.0" y="300.0" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">no ggml in the loop</text>
<rect x="400" y="356" width="660" height="92" rx="6" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="730.0" y="381.48" font-size="13" font-weight="600" fill="#2a8c82" text-anchor="middle">OpenVINO runtime + Intel GPU plugin</text>
<text x="730.0" y="398.04" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">graph transformations (fusions, weight decompression patterns), kernel selection,</text>
<text x="730.0" y="414.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">constant upload to GPU memory, OpenCL / oneDNN kernel compilation</text>
<text x="730.0" y="431.16" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">TernOCL = the 2-bit ternary matmul kernels from OpenVINO PR #38460</text>
<rect x="40" y="356" width="300" height="92" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="190.0" y="406.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">Mesa ANV driver</text>
<rect x="40" y="476" width="1020" height="82" rx="6" fill="#fbeadb" stroke="#c96a1b" stroke-width="1.5"/>
<text x="550.0" y="503.74" font-size="14" font-weight="600" fill="#c96a1b" text-anchor="middle">Hardware</text>
<text x="550.0" y="521.6800000000001" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">Intel Arc B390 integrated GPU (Xe3). No VRAM of its own: it uses system RAM.</text>
<text x="550.0" y="539.6200000000001" font-size="13" font-weight="400" fill="#1b1f24" text-anchor="middle">LPDDR5X-9600, 8 x 16-bit channels = 153.6 GB/s peak, 62 GB shared with the CPU on this box</text>
<line x1="190" y1="136" x2="190" y2="160" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="190.0,160.0 194.5,151.0 185.5,151.0" fill="#1b1f24"/>
<line x1="550" y1="136" x2="550" y2="160" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="550.0,160.0 554.5,151.0 545.5,151.0" fill="#1b1f24"/>
<line x1="910" y1="136" x2="910" y2="160" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="910.0,160.0 914.5,151.0 905.5,151.0" fill="#1b1f24"/>
<line x1="190" y1="234" x2="190" y2="258" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="190.0,258.0 194.5,249.0 185.5,249.0" fill="#1b1f24"/>
<line x1="550" y1="234" x2="550" y2="258" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="550.0,258.0 554.5,249.0 545.5,249.0" fill="#1b1f24"/>
<line x1="550" y1="332" x2="550" y2="356" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="550.0,356.0 554.5,347.0 545.5,347.0" fill="#1b1f24"/>
<line x1="910" y1="332" x2="910" y2="356" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="910.0,356.0 914.5,347.0 905.5,347.0" fill="#1b1f24"/>
<line x1="190" y1="332" x2="190" y2="356" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="190.0,356.0 194.5,347.0 185.5,347.0" fill="#1b1f24"/>
<line x1="190" y1="448" x2="190" y2="476" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="190.0,476.0 194.5,467.0 185.5,467.0" fill="#1b1f24"/>
<line x1="730" y1="448" x2="730" y2="476" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="730.0,476.0 734.5,467.0 725.5,467.0" fill="#1b1f24"/>
<text x="550" y="592" font-size="13" font-weight="400" fill="#6b7480" text-anchor="middle">Same GPU, same weights, three paths: comparing them separates 'the GPU/kernels are slow' from 'the integration is slow'.</text>
</svg>