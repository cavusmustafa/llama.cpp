<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="680" fill="#ffffff"/>
<defs><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a93a0"/></marker></defs>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24">Fix 3 - a reshape that baked in the token count</text>
<text x="24" y="56" font-size="13" fill="#6b7480">Symptom: "Requested output shape [1,1,10,1024] is incompatible with input shape [1,1,42,5120]"</text>

<!-- context -->
<rect x="24" y="76" width="952" height="80" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="40" y="98" font-size="13" font-weight="600" fill="#2f6fb3">Background: one compiled model serves many token counts</text>
<text x="40" y="120" font-size="12" fill="#1b1f24">ggml-openvino compiles an OpenVINO model whose token dimension is DYNAMIC, then replays it for a 42-token prompt,</text>
<text x="40" y="137" font-size="12" fill="#1b1f24">a 2-token warmup, a 1-token decode step, and so on. So any shape written into the graph as a constant must not depend on T.</text>

<!-- the reshape -->
<text x="24" y="188" font-size="14" font-weight="600" fill="#1b1f24">The Hadamard rotation needs a reshape that SPLITS the token axis</text>

<rect x="24" y="202" width="200" height="56" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="124" y="224" font-size="12" font-weight="600" text-anchor="middle" fill="#1b1f24">input</text>
<text x="124" y="244" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle" fill="#1b1f24">[T, 5120]</text>

<path d="M 230 230 L 272 230" stroke="#8a93a0" stroke-width="2" marker-end="url(#a5)"/>
<text x="251" y="222" font-size="10" text-anchor="middle" fill="#6b7480">reshape</text>

<rect x="278" y="202" width="220" height="56" rx="5" fill="#fdf0dc" stroke="#c77c1e" stroke-width="1.5"/>
<text x="388" y="224" font-size="12" font-weight="600" text-anchor="middle" fill="#1b1f24">1024-wide blocks</text>
<text x="388" y="244" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle" fill="#1b1f24">[T * 5, 1024]</text>

<text x="520" y="222" font-size="12" fill="#1b1f24">5120 / 1024 = 5, so the dynamic axis</text>
<text x="520" y="240" font-size="12" fill="#1b1f24">does not keep its size: T becomes T*5.</text>
<text x="520" y="258" font-size="12" font-weight="600" fill="#c0392b">That scaling is what broke the detection.</text>

<!-- before -->
<text x="24" y="300" font-size="14" font-weight="600" fill="#c0392b">BEFORE</text>
<rect x="24" y="312" width="952" height="130" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

<text x="40" y="334" font-size="12" fill="#1b1f24">The decoder looks for the output axis that is "the dynamic one". Its rule was: find an axis with the SAME stride and the</text>
<text x="40" y="351" font-size="12" fill="#1b1f24">SAME extent as the source dynamic axis. Here no axis has extent T (the axis is now T*5), so the rule found nothing.</text>

<rect x="40" y="362" width="270" height="30" rx="4" fill="#ffffff" stroke="#8a93a0"/>
<text x="175" y="381" font-size="11" text-anchor="middle" fill="#1b1f24">dynamic dim = -1 ("none found")</text>
<path d="M 314 377 L 344 377" stroke="#8a93a0" stroke-width="2" marker-end="url(#a5)"/>
<rect x="348" y="362" width="300" height="30" rx="4" fill="#ffffff" stroke="#8a93a0"/>
<text x="498" y="381" font-size="11" text-anchor="middle" fill="#1b1f24">reshape target written as a full constant</text>
<path d="M 652 377 L 682 377" stroke="#8a93a0" stroke-width="2" marker-end="url(#a5)"/>
<rect x="686" y="362" width="274" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="823" y="381" font-size="11" font-family="ui-monospace, Consolas, monospace" font-weight="600" text-anchor="middle" fill="#c0392b">[1, 1, 10, 1024]</text>

<text x="40" y="414" font-size="12" fill="#1b1f24">That 10 came from the 2-token warmup graph (2 * 5 = 10). Replay the same model with a 42-token prompt and the reshape</text>
<text x="40" y="431" font-size="12" fill="#1b1f24">is asked to turn 42*5120 elements into 10*1024. Shape inference throws.</text>

<!-- after -->
<text x="24" y="480" font-size="14" font-weight="600" fill="#2d8a4e">AFTER</text>
<rect x="24" y="492" width="952" height="130" rx="6" fill="#eaf5ee" stroke="#2d8a4e" stroke-width="1.5"/>

<text x="40" y="514" font-size="12" fill="#1b1f24">Added a fallback that runs only when the old rule fails. It looks for the output axis that <tspan font-weight="600">spans the same elements</tspan>:</text>
<text x="40" y="536" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">everything above axis i is static   AND   (elements up to and including i) == (same product in the source)</text>

<rect x="40" y="548" width="270" height="30" rx="4" fill="#ffffff" stroke="#2d8a4e"/>
<text x="175" y="567" font-size="11" text-anchor="middle" fill="#2d8a4e">dynamic dim = axis 2, found</text>
<path d="M 314 563 L 344 563" stroke="#8a93a0" stroke-width="2" marker-end="url(#a5)"/>
<rect x="348" y="548" width="300" height="30" rx="4" fill="#ffffff" stroke="#8a93a0"/>
<text x="498" y="567" font-size="11" text-anchor="middle" fill="#1b1f24">that axis is written as -1, not a number</text>
<path d="M 652 563 L 682 563" stroke="#8a93a0" stroke-width="2" marker-end="url(#a5)"/>
<rect x="686" y="548" width="274" height="30" rx="4" fill="#eaf5ee" stroke="#2d8a4e" stroke-width="1.5"/>
<text x="823" y="567" font-size="11" font-family="ui-monospace, Consolas, monospace" font-weight="600" text-anchor="middle" fill="#2d8a4e">[1, 1, -1, 1024]</text>

<text x="40" y="598" font-size="12" fill="#1b1f24">Now the same compiled model is correct for any T. This fix is fully general - nothing about it is ternary- or Bonsai-specific,</text>
<text x="40" y="615" font-size="12" fill="#1b1f24">and it closes a whole latent class of bugs: any reshape that splits or merges the dynamic axis had the same problem.</text>

<text x="24" y="652" font-size="11" fill="#6b7480">Files: ggml/src/ggml-openvino/openvino/op/reshape.cpp (op_case 0 now honours get_op_dynamic_dim) and ggml-decoder.cpp (the span fallback).</text>
</svg>
