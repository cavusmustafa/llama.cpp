<text x="40" y="591" font-size="13" font-weight="600" fill="#1b1f24">Reading it</text>
<text x="40" y="614" font-size="12.5" fill="#1b1f24">GenAI leads ggml-openvino by 1.10x on decode and 1.27x on pp512; ggml-openvino leads Vulkan by 3.18x on pp512.</text>
<text x="40" y="634" font-size="12.5" fill="#1b1f24">int8 prefill = OV_GPU_TERNOCL_INT2_INT8_PREFILL=1 (prefill only, 2.3x at pp128). The old OV_TERNOCL_... name is ignored here.</text>
<text x="40" y="654" font-size="11.5" fill="#6b7480">GenAI prefill = prompt tokens / first-token latency (llm_bench); decode = 2nd-token throughput.</text>
