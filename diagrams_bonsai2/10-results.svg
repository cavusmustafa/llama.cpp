<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="680" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24">Measured results - Bonsai 2 27B PQ2_0</text>
<text x="24" y="56" font-size="13" fill="#6b7480">Intel Arc B390 iGPU (Xe3), same GPU and same model file for both backends. llama-bench -r 3 -ngl 99. Higher is better.</text>

<!-- legend -->
<rect x="24" y="72" width="14" height="14" rx="2" fill="#2f6fb3"/><text x="44" y="84" font-size="11.5" fill="#1b1f24">ggml-openvino + TernOCL (default)</text>
<rect x="254" y="72" width="14" height="14" rx="2" fill="#c77c1e"/><text x="274" y="84" font-size="11.5" fill="#1b1f24">ggml-openvino, INT8_PREFILL=1</text>
<rect x="484" y="72" width="14" height="14" rx="2" fill="#2a8c82"/><text x="504" y="84" font-size="11.5" fill="#1b1f24">ggml-vulkan</text>
<rect x="624" y="72" width="14" height="14" rx="2" fill="#c0392b"/><text x="644" y="84" font-size="11.5" fill="#1b1f24">ggml-openvino, TernOCL disabled</text>

<!-- PREFILL pp512 -->
<text x="24" y="124" font-size="14" font-weight="600" fill="#1b1f24">Prefill, 512-token prompt  (t/s)</text>
<line x1="210" y1="134" x2="210" y2="248" stroke="#8a93a0"/>
<text x="200" y="156" font-size="11.5" text-anchor="end" fill="#1b1f24">OV int8</text>
<rect x="210" y="142" width="400" height="20" rx="2" fill="#c77c1e"/>
<text x="620" y="157" font-size="12" font-weight="600" fill="#1b1f24">571.1</text>
<text x="200" y="186" font-size="11.5" text-anchor="end" fill="#1b1f24">OV default</text>
<rect x="210" y="172" width="369" height="20" rx="2" fill="#2f6fb3"/>
<text x="589" y="187" font-size="12" font-weight="600" fill="#1b1f24">527.4</text>
<text x="200" y="216" font-size="11.5" text-anchor="end" fill="#1b1f24">Vulkan</text>
<rect x="210" y="202" width="116" height="20" rx="2" fill="#2a8c82"/>
<text x="336" y="217" font-size="12" font-weight="600" fill="#1b1f24">165.4</text>
<text x="700" y="180" font-size="15" font-weight="600" fill="#2f6fb3">OV is 3.2x Vulkan</text>
<text x="700" y="200" font-size="12" fill="#6b7480">3.5x with int8 prefill</text>

<!-- PREFILL pp128 -->
<text x="24" y="272" font-size="14" font-weight="600" fill="#1b1f24">Prefill, 128-token prompt  (t/s)</text>
<line x1="210" y1="282" x2="210" y2="396" stroke="#8a93a0"/>
<text x="200" y="304" font-size="11.5" text-anchor="end" fill="#1b1f24">OV int8</text>
<rect x="210" y="290" width="371" height="20" rx="2" fill="#c77c1e"/>
<text x="591" y="305" font-size="12" font-weight="600" fill="#1b1f24">530.2</text>
<text x="200" y="334" font-size="11.5" text-anchor="end" fill="#1b1f24">OV default</text>
<rect x="210" y="320" width="164" height="20" rx="2" fill="#2f6fb3"/>
<text x="384" y="335" font-size="12" font-weight="600" fill="#1b1f24">233.9</text>
<text x="200" y="364" font-size="11.5" text-anchor="end" fill="#1b1f24">Vulkan</text>
<rect x="210" y="350" width="113" height="20" rx="2" fill="#2a8c82"/>
<text x="333" y="365" font-size="12" font-weight="600" fill="#1b1f24">161.0</text>
<text x="700" y="320" font-size="12" fill="#6b7480">Vulkan is flat from 128 to 512</text>
<text x="700" y="338" font-size="12" fill="#6b7480">(161 -&gt; 165): a per-token kernel.</text>
<text x="700" y="356" font-size="12" fill="#6b7480">OV scales (234 -&gt; 527): a tiled GEMM.</text>

<!-- DECODE -->
<text x="24" y="420" font-size="14" font-weight="600" fill="#1b1f24">Decode, 32 tokens  (t/s)   -   note the different scale</text>
<line x1="210" y1="430" x2="210" y2="544" stroke="#8a93a0"/>
<text x="200" y="452" font-size="11.5" text-anchor="end" fill="#1b1f24">Vulkan</text>
<rect x="210" y="438" width="264" height="20" rx="2" fill="#2a8c82"/>
<text x="484" y="453" font-size="12" font-weight="600" fill="#1b1f24">12.32</text>
<text x="200" y="482" font-size="11.5" text-anchor="end" fill="#1b1f24">OV default</text>
<rect x="210" y="468" width="262" height="20" rx="2" fill="#2f6fb3"/>
<text x="482" y="483" font-size="12" font-weight="600" fill="#1b1f24">12.25</text>
<text x="200" y="512" font-size="11.5" text-anchor="end" fill="#1b1f24">OV int8</text>
<rect x="210" y="498" width="249" height="20" rx="2" fill="#c77c1e"/>
<text x="469" y="513" font-size="12" font-weight="600" fill="#1b1f24">11.64</text>
<text x="700" y="470" font-size="15" font-weight="600" fill="#6b7480">A tie</text>
<text x="700" y="492" font-size="12" fill="#6b7480">6.70 GiB x 12 t/s = ~80 GB/s,</text>
<text x="700" y="510" font-size="12" fill="#6b7480">which is all this iGPU sustains.</text>
<text x="700" y="528" font-size="12" fill="#6b7480">Bandwidth-bound, not kernel-bound.</text>

<!-- disabled callout -->
<rect x="24" y="564" width="952" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="586" font-size="13" font-weight="600" fill="#c0392b">The PR is required, not an optimization</text>
<text x="40" y="610" font-size="12" fill="#1b1f24">Turn the ternary kernels off and the SAME model on the SAME GPU runs at:</text>
<text x="40" y="636" font-size="14" font-weight="600" fill="#c0392b">1.4 t/s prefill   (167x slower)        1.24 t/s decode   (9.9x slower)</text>
<text x="530" y="636" font-size="11.5" fill="#6b7480">- the u2 weights fall back to OpenVINO's generic</text>
<text x="530" y="652" font-size="11.5" fill="#6b7480">decompression path, which has no 2-bit specialization.</text>
<text x="40" y="654" font-size="11" fill="#6b7480">Caveat: this switch also disables the gate/up merge and the Hadamard fold, so it is "whole PR off vs on".</text>
</svg>
