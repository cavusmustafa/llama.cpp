<text x="50" y="327.92" font-size="13" font-weight="600" fill="#c96a1b" text-anchor="start">Next steps</text>
<text x="50" y="344.48" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">1. memory fixes -&gt; upstream OpenVINO: unit tests, Windows eviction path, measure const-prop chunking on a dGPU</text>
<text x="50" y="361.04" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">2. device-resident GDN recurrent state: ~+4.7% decode (-&gt; ~14.0 t/s, gap to native ~1.04x)</text>
<text x="50" y="377.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">3. PTQ1_0 (Bonsai 1, 1.58-bit) in ggml-openvino - not supported yet</text>
<text x="50" y="394.16" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">4. upstreaming the ternary backend work is blocked until PQ2_0 exists outside the PrismML fork</text>
<text x="50" y="410.72" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">5. int8 prefill as default needs a real accuracy run (GSM8K-style), not a 90-token diff</text>
