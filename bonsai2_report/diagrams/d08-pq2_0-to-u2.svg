<polygon points="520.0,226.0 530.1,226.5 526.4,218.3" fill="#2a8c82"/>
<line x1="575" y1="148" x2="950" y2="226" stroke="#2f6fb3" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="950.0,226.0 942.1,219.8 940.3,228.6" fill="#2f6fb3"/>
<line x1="952" y1="148" x2="710" y2="226" stroke="#2a8c82" stroke-width="1.6"/>
<polygon points="710.0,226.0 719.9,227.5 717.2,219.0" fill="#2a8c82"/>
<line x1="830" y1="148" x2="1000" y2="226" stroke="#2f6fb3" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="1000.0,226.0 993.7,218.2 989.9,226.3" fill="#2f6fb3"/>
<rect x="40" y="356" width="1020" height="47.599999999999994" rx="6" fill="#fbf1d3" stroke="#a07a12" stroke-width="1.5"/>
<text x="50" y="375.84000000000003" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">Both formats put element j at bits [2(j%4), 2(j%4)+1] of byte j/4, lowest bits first (OpenVINO packs every sub-byte type</text>
<text x="50" y="392.40000000000003" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">LSB-first except u1). Only the scales need gathering into their own array, because ggml interleaves them with the codes.</text>
</svg>