<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c82"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96a1b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07a12"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">Step 3b - where one decode token's time goes</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">GGML_OPENVINO_PROFILING=2 per-op timings in steady-state decode; GPU busy measured from the xe PMU.</text>
<text x="188" y="140" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="end">ggml-openvino</text>
<text x="188" y="220" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="end">native OpenVINO</text>
<rect x="200" y="110" width="614.84" height="46" rx="3" fill="#2a8c82" stroke="none" opacity="1.0"/>
<text x="507.42" y="139" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">ternary GEMVs 64.72 ms</text>
<rect x="814.84" y="110" width="113.81" height="46" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="936.65" y="139" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">76.70 ms = 13.0 t/s</text>
<text x="871.65" y="102" font-size="12" font-weight="600" fill="#b8433a" text-anchor="middle">other ops 11.98</text>
<rect x="200" y="190" width="614.84" height="46" rx="3" fill="#2a8c82" stroke="none" opacity="1.0"/>
<text x="507.42" y="219" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">same GEMVs</text>
<rect x="814.84" y="190" width="23.465000000000003" height="46" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="846.305" y="219" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">67.19 ms = 14.9 t/s</text>
<text x="40" y="280" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">The 11.98 ms of 'other' (2718 ops per token, mean 4.9 us each - count matters, not speed):</text>
<text x="250" y="308.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">Transpose (273)</text>
<rect x="260" y="296" width="367.5" height="18" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="633.5" y="308.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">2.80 ms</text>
<text x="250" y="332.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">Convert (275)</text>
<rect x="260" y="320" width="330.75" height="18" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="596.75" y="332.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">2.52 ms</text>
<text x="250" y="356.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">GatedDeltaNet (48)</text>
<rect x="260" y="344" width="245.43750000000003" height="18" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="511.4375" y="356.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">1.87 ms</text>
<text x="250" y="380.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">Result writeback (96)</text>
<rect x="260" y="368" width="139.125" height="18" rx="3" fill="#b8433a" stroke="none" opacity="1.0"/>
<text x="405.125" y="380.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">1.06 ms</text>
<text x="250" y="404.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">FC bf16 alpha/beta (97)</text>
<rect x="260" y="392" width="118.125" height="18" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="384.125" y="404.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">0.90 ms</text>
<text x="250" y="428.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">RMS norm (209)</text>
<rect x="260" y="416" width="91.875" height="18" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="357.875" y="428.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">0.70 ms</text>
<text x="250" y="452.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">StridedSlice (336)</text>
<rect x="260" y="440" width="51.1875" height="18" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="317.1875" y="452.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">0.39 ms</text>
<text x="250" y="476.24" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="end">rest (Concat, SDPA, Add...)</text>
<rect x="260" y="464" width="228.37499999999997" height="18" rx="3" fill="#6b7480" stroke="none" opacity="1.0"/>
<text x="494.375" y="476.24" font-size="12" font-weight="600" fill="#1b1f24" text-anchor="start">1.74 ms</text>
<rect x="760" y="280" width="300" height="200" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="910.0" y="326.36" font-size="13" font-weight="600" fill="#2f6fb3" text-anchor="middle">Ruled out</text>
<text x="910.0" y="342.92" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">GPU compute engine busy:</text>
<text x="910.0" y="359.48" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">ggml-openvino 99.99%</text>
<text x="910.0" y="376.04" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">native OpenVINO 99.95%</text>
<text x="910.0" y="392.6" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle"></text>
<text x="910.0" y="409.16" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">-&gt; NOT host dispatch, NOT idle,</text>
<text x="910.0" y="425.72" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">NOT bandwidth: ggml-openvino just</text>
<text x="910.0" y="442.28" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">gives the GPU more small ops</text>
</svg>