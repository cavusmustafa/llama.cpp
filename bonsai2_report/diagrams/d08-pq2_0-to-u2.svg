<rect width="1100" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="start">Fix 1 - reading PQ2_0 as OpenVINO u2: a memcpy, not a conversion</text>
<text x="24" y="56" font-size="13" font-weight="400" fill="#6b7480" text-anchor="start">OpenVINO has no signed 2-bit type, but 'u2 with zero point 1' is exactly PQ2_0's (code - 1) x d.</text>
<text x="40" y="96" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">ggml tensor in the GGUF file: scale and codes interleaved per block</text>
<rect x="40" y="108" width="50" height="40" rx="2" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="65.0" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">d0</text>
<rect x="90" y="108" width="195" height="40" rx="2" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="187.5" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">qs0 (32 B)</text>
<rect x="295" y="108" width="50" height="40" rx="2" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="320.0" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">d1</text>
<rect x="345" y="108" width="195" height="40" rx="2" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="442.5" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">qs1 (32 B)</text>
<rect x="550" y="108" width="50" height="40" rx="2" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="575.0" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">d2</text>
<rect x="600" y="108" width="195" height="40" rx="2" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="697.5" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">qs2 (32 B)</text>
<rect x="805" y="108" width="50" height="40" rx="2" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="830.0" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">d3</text>
<rect x="855" y="108" width="195" height="40" rx="2" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="952.5" y="132.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">qs3 (32 B)</text>
<text x="1065" y="133" font-size="16" font-weight="400" fill="#6b7480" text-anchor="start">...</text>
<text x="40" y="214" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">OpenVINO model: three separate Constants</text>
<rect x="40" y="226" width="760" height="44" rx="2" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="420.0" y="252.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">u2 codes: qs0 | qs1 | qs2 | qs3 | ...   (byte-for-byte copy, no bit shuffling)</text>
<rect x="820" y="226" width="240" height="44" rx="2" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="940.0" y="252.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">f16 scales: d0 d1 d2 d3 ...</text>
<rect x="40" y="290" width="300" height="44" rx="2" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="190.0" y="316.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">zero point: one f16 Constant = 1</text>
