<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="740" fill="#ffffff"/>
<defs><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a93a0"/></marker></defs>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24">The Hadamard rotated basis - and why the model needs it at run time</text>

<!-- why -->
<text x="24" y="70" font-size="14" font-weight="600" fill="#1b1f24">1. Why rotate at all</text>
<rect x="24" y="82" width="952" height="96" rx="6" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="40" y="104" font-size="12" fill="#1b1f24">Ternary quantization has exactly three levels per group. A group whose values are mostly tiny plus one huge outlier quantizes</text>
<text x="40" y="121" font-size="12" fill="#1b1f24">terribly: the scale is set by the outlier, so everything else collapses to 0.</text>
<text x="40" y="145" font-size="12" fill="#1b1f24">A Hadamard rotation is an orthogonal mixing of 1024 channels: every output is a +/- sum of all 1024 inputs. That smears any</text>
<text x="40" y="162" font-size="12" fill="#1b1f24">single outlier across the whole block, so the values become near-Gaussian and ternary loses far less.</text>
<text x="600" y="145" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#2d8a4e">W_rot = W . H</text>
<text x="600" y="163" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#2d8a4e">x_rot = H . x</text>
<text x="600" y="181" font-size="11.5" fill="#6b7480">H orthogonal =&gt; W_rot . x_rot = W . x</text>

<!-- what -->
<text x="24" y="212" font-size="14" font-weight="600" fill="#1b1f24">2. What exactly the transform is (read from the GGUF metadata)</text>
<rect x="24" y="224" width="468" height="150" rx="6" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="40" y="246" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">prism.hadamard.block_size  = 1024</text>
<text x="40" y="265" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">prism.hadamard.transform   = normalized-sylvester-</text>
<text x="40" y="282" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">                             walsh-hadamard</text>
<text x="40" y="301" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">prism.hadamard.axis        = input-last-dimension</text>
<text x="40" y="320" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">prism.hadamard.sign_mode   = explicit</text>
<text x="40" y="339" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">prism.hadamard.sign_widths = [5120, 6144, 17408]</text>
<text x="40" y="361" font-size="11" fill="#6b7480">one +/-1 vector per distinct input width</text>

<rect x="508" y="224" width="468" height="150" rx="6" fill="#eaf5ee" stroke="#2d8a4e"/>
<text x="524" y="246" font-size="12.5" font-weight="600" fill="#2d8a4e">The matrix is generated, not stored</text>
<text x="524" y="268" font-size="11.5" fill="#1b1f24">llama.cpp builds H_1024 at load time from the parity rule:</text>
<text x="524" y="290" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">H[r][c] = popcount(r &amp; c) odd ? -s : +s</text>
<text x="524" y="310" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#1b1f24">s       = 1 / sqrt(1024) = 1/32</text>
<text x="524" y="334" font-size="11.5" fill="#1b1f24">It becomes an ordinary f32 [1024, 1024] weight tensor,</text>
<text x="524" y="351" font-size="11.5" fill="#1b1f24">named prism.hadamard.1024, plus f32 sign vectors</text>
<text x="524" y="368" font-size="11.5" fill="#1b1f24">named prism.hadamard.signs.&lt;width&gt;.</text>

<!-- ggml graph -->
<text x="24" y="408" font-size="14" font-weight="600" fill="#1b1f24">3. What it looks like in the ggml graph, in front of every folded weight</text>
<text x="24" y="428" font-size="12" fill="#6b7480">Built by llama_mul_mat_hadamard() in src/llama-impl.h - it is ordinary ggml ops, nothing special.</text>

<rect x="24" y="442" width="104" height="40" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="76" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">activation x</text>
<text x="76" y="476" font-size="11" text-anchor="middle" fill="#1b1f24">[T, K]</text>
<path d="M 132 462 L 158 462" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>

<rect x="162" y="442" width="110" height="40" rx="5" fill="#fdf0dc" stroke="#c77c1e" stroke-width="1.5"/>
<text x="217" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">MUL</text>
<text x="217" y="476" font-size="11" text-anchor="middle" fill="#1b1f24">by signs [K]</text>
<path d="M 276 462 L 302 462" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>

<rect x="306" y="442" width="124" height="40" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="368" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">RESHAPE</text>
<text x="368" y="476" font-size="11" text-anchor="middle" fill="#1b1f24">[T*K/1024, 1024]</text>
<path d="M 434 462 L 460 462" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>

<rect x="464" y="442" width="130" height="40" rx="5" fill="#f0e9f5" stroke="#7d5ba6" stroke-width="1.5"/>
<text x="529" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4a3366">MUL_MAT</text>
<text x="529" y="476" font-size="11" text-anchor="middle" fill="#4a3366">by H [1024,1024]</text>
<path d="M 598 462 L 624 462" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>

<rect x="628" y="442" width="110" height="40" rx="5" fill="#f7f9fb" stroke="#8a93a0"/>
<text x="683" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">RESHAPE</text>
<text x="683" y="476" font-size="11" text-anchor="middle" fill="#1b1f24">back to [T, K]</text>
<path d="M 742 462 L 768 462" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>

<rect x="772" y="442" width="204" height="40" rx="5" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="874" y="460" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f24">MUL_MAT by the</text>
<text x="874" y="476" font-size="11" text-anchor="middle" fill="#1b1f24">ternary weight</text>

<text x="24" y="504" font-size="11.5" fill="#6b7480">Applied to: output.weight, and per layer attn_qkv / attn_gate / ssm_out / ffn_gate / ffn_up / ffn_down (and the attn_q/k/v of full-attention layers).</text>
<text x="24" y="521" font-size="11.5" fill="#6b7480">token_embd gets the INVERSE rotation instead, because its rows are read by a lookup rather than a matmul.</text>

<!-- fold -->
<text x="24" y="556" font-size="14" font-weight="600" fill="#1b1f24">4. In OpenVINO the whole chain collapses into the matmul</text>

<rect x="24" y="570" width="440" height="78" rx="6" fill="#fdecea" stroke="#c0392b"/>
<text x="244" y="592" font-size="12.5" font-weight="600" text-anchor="middle" fill="#c0392b">without the fold</text>
<text x="40" y="614" font-size="11.5" fill="#1b1f24">~400 extra 1024x1024 matmuls per token, plus the</text>
<text x="40" y="631" font-size="11.5" fill="#1b1f24">reshapes - real work on the critical path.</text>

<path d="M 474 609 L 516 609" stroke="#8a93a0" stroke-width="2" marker-end="url(#a2)"/>
<text x="495" y="600" font-size="10" text-anchor="middle" fill="#6b7480">GPU plugin pass</text>
<text x="495" y="628" font-size="10" text-anchor="middle" fill="#6b7480">FuseHadamardIntoFC</text>

<rect x="536" y="570" width="440" height="78" rx="6" fill="#eaf5ee" stroke="#2d8a4e"/>
<text x="756" y="592" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d8a4e">with the fold (default)</text>
<text x="552" y="614" font-size="11.5" fill="#1b1f24">signs + rotation become attributes on the matmul; the</text>
<text x="552" y="631" font-size="11.5" fill="#1b1f24">kernel runs a fast FWHT into scratch, then the GEMM.</text>

<rect x="24" y="662" width="952" height="62" rx="6" fill="#fdf0dc" stroke="#c77c1e" stroke-width="1.5"/>
<text x="40" y="684" font-size="12" fill="#1b1f24">The pass verifies the constant really is the normalized Sylvester H_1024 before folding. It also means the ternary kernel is the</text>
<text x="40" y="701" font-size="12" fill="#1b1f24">ONLY implementation that applies the rotation - so if that kernel later refuses the node, the plugin raises a hard error instead of</text>
<text x="40" y="718" font-size="12" fill="#1b1f24">falling back to a kernel that would silently ignore the transform and produce garbage. That behaviour drove most of the debugging.</text>
</svg>
