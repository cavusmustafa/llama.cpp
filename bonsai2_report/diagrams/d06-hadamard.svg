<text x="40" y="200.0" font-size="12" font-weight="400" fill="#6b7480" text-anchor="start">Ternary has 3 levels. The scale is set by the outlier,</text>
<text x="40" y="216.2" font-size="12" font-weight="400" fill="#6b7480" text-anchor="start">so every small weight rounds to 0: information lost.</text>
<text x="600" y="200.0" font-size="12" font-weight="400" fill="#6b7480" text-anchor="start">Values are now roughly Gaussian and similar in size,</text>
<text x="600" y="216.2" font-size="12" font-weight="400" fill="#6b7480" text-anchor="start">so -1/0/+1 x scale keeps most of the information.</text>
<line x1="470" y1="140" x2="590" y2="140" stroke="#3a8a3a" stroke-width="1.6"/>
<polygon points="590.0,140.0 581.0,135.5 581.0,144.5" fill="#3a8a3a"/>
<text x="530.0" y="134.0" font-size="11" font-weight="400" fill="#3a8a3a" text-anchor="middle">x H (offline)</text>
<rect x="40" y="260" width="1020" height="96" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="550.0" y="284.06" font-size="15" font-weight="600" fill="#2f6fb3" text-anchor="middle">The math (H = 1024 x 1024 normalized Walsh-Hadamard matrix, entries +-1/32, plus a fixed sign flip)</text>
<text x="550.0" y="303.38" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="middle">W_rot = W . H         done once, offline, when the model was quantized</text>
<text x="550.0" y="322.7" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="middle">x_rot = H . x          must happen at run time, on every forward pass</text>
<text x="550.0" y="342.02" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="middle">W_rot . x_rot = W . x  because H is orthogonal - the result is unchanged</text>
<text x="40" y="392" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="start">In the ggml graph, in front of every ternary matmul:</text>
<rect x="40" y="406" width="150" height="44" rx="6" fill="#f1f3f5" stroke="#6b7480" stroke-width="1.5"/>
<text x="115.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">x</text>
<rect x="212" y="406" width="150" height="44" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="287.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">MUL by signs</text>
<line x1="190" y1="428" x2="212" y2="428" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="212.0,428.0 203.0,423.5 203.0,432.5" fill="#1b1f24"/>
<rect x="384" y="406" width="150" height="44" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="459.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">RESHAPE</text>
<line x1="362" y1="428" x2="384" y2="428" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="384.0,428.0 375.0,423.5 375.0,432.5" fill="#1b1f24"/>
<rect x="556" y="406" width="150" height="44" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="631.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">MUL_MAT by H</text>
<line x1="534" y1="428" x2="556" y2="428" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="556.0,428.0 547.0,423.5 547.0,432.5" fill="#1b1f24"/>
<rect x="728" y="406" width="150" height="44" rx="6" fill="#dce9f5" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="803.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">RESHAPE back</text>
<line x1="706" y1="428" x2="728" y2="428" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="728.0,428.0 719.0,423.5 719.0,432.5" fill="#1b1f24"/>
<rect x="900" y="406" width="150" height="44" rx="6" fill="#e4f1ef" stroke="#2a8c82" stroke-width="1.5"/>
<text x="975.0" y="432.32" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle">MUL_MAT by W</text>
<line x1="878" y1="428" x2="900" y2="428" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="900.0,428.0 891.0,423.5 891.0,432.5" fill="#1b1f24"/>
<text x="380" y="470" font-size="11" font-weight="400" fill="#6b7480" text-anchor="middle">[T, K] -&gt; [T*K/1024, 1024]</text>
<rect x="40" y="490" width="1020" height="64.4" rx="6" fill="#fbf1d3" stroke="#a07a12" stroke-width="1.5"/>
<text x="50" y="509.96000000000004" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">Skip the activation rotation and the output is garbage, not 'slightly worse'. So the rotation is part of the model.</text>
<text x="50" y="526.52" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">Ordinary ops (MUL, RESHAPE, MUL_MAT) - any backend can run it, but ~400 extra 1024x1024 matmuls per token is slow.</text>
<text x="50" y="543.08" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="start">OpenVINO's GPU plugin (PR #38460) recognises the chain and folds it into the ternary matmul kernel: FuseHadamardIntoFC.</text>
</svg>