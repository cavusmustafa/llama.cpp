<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#1b1f24">Bonsai 2 27B - model architecture</text>
<text x="24" y="56" font-size="13" fill="#6b7480">GGUF arch = "qwen35" (dense, no MoE). 26.9 B params, 64 layers, n_embd 5120, vocab 248320, ctx 262144.</text>
<text x="24" y="74" font-size="13" fill="#6b7480">Hybrid: 3 out of every 4 layers use linear attention (GatedDeltaNet), the 4th uses full attention.</text>

<!-- ===== left: layer stack ===== -->
<text x="24" y="110" font-size="14" font-weight="600" fill="#1b1f24">Layer stack</text>

<rect x="24" y="124" width="210" height="34" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="129" y="146" font-size="12.5" text-anchor="middle" fill="#1b1f24">token_embd  [5120, 248320]</text>
<text x="240" y="139" font-size="11" fill="#c77c1e">ternary</text>
<text x="240" y="152" font-size="11" fill="#c77c1e">+ inverse rotation</text>

<line x1="129" y1="158" x2="129" y2="176" stroke="#8a93a0" stroke-width="1.5"/>

<rect x="24" y="176" width="210" height="150" rx="6" fill="#f7f9fb" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="129" y="196" font-size="12" font-weight="600" text-anchor="middle" fill="#2f6fb3">repeating group of 4</text>
<rect x="38" y="204" width="182" height="24" rx="4" fill="#e4f1ef" stroke="#2a8c82"/>
<text x="129" y="220" font-size="11.5" text-anchor="middle" fill="#1b1f24">layer 0 - GatedDeltaNet</text>
<rect x="38" y="232" width="182" height="24" rx="4" fill="#e4f1ef" stroke="#2a8c82"/>
<text x="129" y="248" font-size="11.5" text-anchor="middle" fill="#1b1f24">layer 1 - GatedDeltaNet</text>
<rect x="38" y="260" width="182" height="24" rx="4" fill="#e4f1ef" stroke="#2a8c82"/>
<text x="129" y="276" font-size="11.5" text-anchor="middle" fill="#1b1f24">layer 2 - GatedDeltaNet</text>
<rect x="38" y="288" width="182" height="24" rx="4" fill="#fdf0dc" stroke="#c77c1e"/>
<text x="129" y="304" font-size="11.5" text-anchor="middle" fill="#1b1f24">layer 3 - full attention</text>

<text x="248" y="246" font-size="12" fill="#2f6fb3">x16</text>
<text x="248" y="262" font-size="11" fill="#6b7480">= 64 layers</text>
<text x="248" y="278" font-size="11" fill="#6b7480">48 GDN</text>
<text x="248" y="292" font-size="11" fill="#6b7480">16 full attn</text>

<line x1="129" y1="326" x2="129" y2="344" stroke="#8a93a0" stroke-width="1.5"/>
<rect x="24" y="344" width="210" height="30" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="129" y="364" font-size="12.5" text-anchor="middle" fill="#1b1f24">output_norm (f32)</text>
<line x1="129" y1="374" x2="129" y2="392" stroke="#8a93a0" stroke-width="1.5"/>
<rect x="24" y="392" width="210" height="34" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="129" y="414" font-size="12.5" text-anchor="middle" fill="#1b1f24">output  [5120, 248320]</text>
<text x="240" y="411" font-size="11" fill="#c77c1e">ternary</text>

<text x="24" y="458" font-size="12" font-weight="600" fill="#1b1f24">Weight types in the file</text>
<text x="24" y="478" font-size="11.5" fill="#6b7480">402 tensors ternary PQ2_0  - all the big projections</text>
<text x="24" y="495" font-size="11.5" fill="#6b7480">96 tensors BF16  - ssm_alpha / ssm_beta  [5120, 48]</text>
<text x="24" y="512" font-size="11.5" fill="#6b7480">353 tensors F32  - norms, conv1d, biases</text>
<text x="24" y="536" font-size="11.5" fill="#1b1f24">6.70 GiB total = 2.13 bits per weight</text>
<text x="24" y="553" font-size="11.5" fill="#6b7480">(fp16 would be ~54 GB)</text>

<!-- ===== right: one layer expanded ===== -->
<text x="320" y="110" font-size="14" font-weight="600" fill="#1b1f24">What one layer does</text>

<rect x="320" y="124" width="300" height="28" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="470" y="143" font-size="12" text-anchor="middle" fill="#1b1f24">attn_norm (RMS, f32)</text>
<line x1="470" y1="152" x2="470" y2="168" stroke="#8a93a0" stroke-width="1.5"/>

<rect x="320" y="168" width="300" height="28" rx="5" fill="#f0e9f5" stroke="#7d5ba6" stroke-width="1.5"/>
<text x="470" y="187" font-size="12" font-weight="600" text-anchor="middle" fill="#4a3366">MIXER  (one of the two below)</text>
<line x1="470" y1="196" x2="470" y2="212" stroke="#8a93a0" stroke-width="1.5"/>

<rect x="320" y="212" width="300" height="26" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="470" y="230" font-size="12" text-anchor="middle" fill="#1b1f24">+ residual</text>
<line x1="470" y1="238" x2="470" y2="254" stroke="#8a93a0" stroke-width="1.5"/>
<rect x="320" y="254" width="300" height="26" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="470" y="272" font-size="12" text-anchor="middle" fill="#1b1f24">post_attention_norm</text>
<line x1="470" y1="280" x2="470" y2="296" stroke="#8a93a0" stroke-width="1.5"/>

<rect x="320" y="296" width="300" height="86" rx="6" fill="#f7f9fb" stroke="#2a8c82" stroke-width="1.5"/>
<text x="470" y="315" font-size="12" font-weight="600" text-anchor="middle" fill="#2a8c82">FFN - SwiGLU (same in both layer types)</text>
<text x="334" y="335" font-size="11.5" fill="#1b1f24">ffn_gate  [5120 -&gt; 17408]   ffn_up  [5120 -&gt; 17408]</text>
<text x="334" y="353" font-size="11.5" fill="#1b1f24">silu(gate) * up</text>
<text x="334" y="371" font-size="11.5" fill="#1b1f24">ffn_down  [17408 -&gt; 5120]</text>
<line x1="470" y1="382" x2="470" y2="398" stroke="#8a93a0" stroke-width="1.5"/>
<rect x="320" y="398" width="300" height="26" rx="5" fill="#eef2f6" stroke="#8a93a0"/>
<text x="470" y="416" font-size="12" text-anchor="middle" fill="#1b1f24">+ residual</text>

<!-- mixer variant A -->
<rect x="650" y="124" width="326" height="176" rx="6" fill="#f3faf8" stroke="#2a8c82" stroke-width="1.5"/>
<text x="664" y="144" font-size="12.5" font-weight="600" fill="#2a8c82">A. GatedDeltaNet - linear attention (48 layers)</text>
<text x="664" y="164" font-size="11.5" fill="#1b1f24">attn_qkv [5120 -&gt; 10240]  =  q 2048 | k 2048 | v 6144</text>
<text x="664" y="181" font-size="11.5" fill="#1b1f24">ssm_conv1d, kernel 4, over all 10240 channels, then SiLU</text>
<text x="664" y="198" font-size="11.5" fill="#c0392b">q and k L2-normalized TOGETHER as one [128, 32] tensor</text>
<text x="664" y="215" font-size="11.5" fill="#1b1f24">16 k/q heads, 48 v heads, head dim 128 (GQA 3:1)</text>
<text x="664" y="232" font-size="11.5" fill="#1b1f24">recurrent scan, state [128, 128] per v head</text>
<text x="664" y="249" font-size="11.5" fill="#1b1f24">gates: ssm_alpha / ssm_beta (BF16), ssm_a, ssm_dt.bias</text>
<text x="664" y="266" font-size="11.5" fill="#1b1f24">ssm_norm, gated by z = attn_gate [5120 -&gt; 6144]</text>
<text x="664" y="283" font-size="11.5" fill="#1b1f24">ssm_out [6144 -&gt; 5120]</text>

<!-- mixer variant B -->
<rect x="650" y="316" width="326" height="146" rx="6" fill="#fdf7ee" stroke="#c77c1e" stroke-width="1.5"/>
<text x="664" y="336" font-size="12.5" font-weight="600" fill="#a8641a">B. Full attention (16 layers, every 4th)</text>
<text x="664" y="356" font-size="11.5" fill="#1b1f24">attn_q [5120 -&gt; 12288] = q 6144 + output gate 6144</text>
<text x="664" y="373" font-size="11.5" fill="#1b1f24">attn_k, attn_v [5120 -&gt; 1024] each</text>
<text x="664" y="390" font-size="11.5" fill="#1b1f24">24 q heads, 4 kv heads, head dim 256 (GQA 6:1)</text>
<text x="664" y="407" font-size="11.5" fill="#1b1f24">per-head q/k RMS norm [256]</text>
<text x="664" y="424" font-size="11.5" fill="#1b1f24">interleaved MRoPE, sections [11, 11, 10, 0], base 1e7</text>
<text x="664" y="441" font-size="11.5" fill="#1b1f24">attn_output [6144 -&gt; 5120]</text>

<!-- note -->
<rect x="320" y="452" width="656" height="106" rx="6" fill="#fdf0dc" stroke="#c77c1e" stroke-width="1.5"/>
<text x="334" y="472" font-size="12.5" font-weight="600" fill="#a8641a">Every ternary projection lives in a rotated basis</text>
<text x="334" y="492" font-size="11.5" fill="#1b1f24">The weights were not quantized directly. First the input axis was rotated by a 1024-wide Hadamard</text>
<text x="334" y="509" font-size="11.5" fill="#1b1f24">matrix (with a per-column sign flip), which spreads outliers so that ternary quantization loses less.</text>
<text x="334" y="526" font-size="11.5" fill="#1b1f24">So at run time the activation must get the SAME transform before every such matmul, otherwise the</text>
<text x="334" y="543" font-size="11.5" fill="#1b1f24">output is garbage. See diagram 04.</text>

<text x="24" y="590" font-size="11" fill="#6b7480">All numbers read from the GGUF metadata and tensor table of Ternary-Bonsai-2-27B-PQ2_0.gguf.</text>
</svg>
